# Schritt-Paarung fuer `tessera eval` (Extraktion <-> Handdatei).
#
# Jede Gruppe ordnet n Extraktionsschritte m Handschritten zu (1:1, n:1, 1:n).
# Eine Seite leer = Schritt bewusst ohne Entsprechung. `nicht_belegbar: true`
# (nur ohne Extraktionsschritte) markiert Handschritte, die die Quelle nicht
# woertlich nennt (Start-/Entscheidungs-/Endknoten); der Report zeigt dann
# zusaetzlich den Recall ohne sie. Jede Schritt-ID beider Dateien genau einmal;
# die Labels muessen den aktuellen Dateien entsprechen (sonst veraltet).
# Optional `akteure:` — extrahierte Rollennamen, die weder ID noch Label der
# Handdatei-actors[] treffen: `Name: id` (zuordnen), `Name: null` (bewusst ohne
# Entsprechung) oder `Name: ""` (noch offen).
# Nach dem Pruefen `status: bestaetigt` setzen.
#
# Vorschlag von Claude fuer den Lauf L5 vom 2026-11-27, aus dem
# `--propose-pairs`-Entwurf korrigiert. Extraktions-Labels aus der
# Konsolenausgabe des Laufs uebernommen, Hand-Labels aus maschinerie-zuerich
# main; out/*.json und die Quellseiten wurden dabei NICHT eingesehen.
# `nicht_belegbar` nur fuer Start-, Entscheidungs- und Endknoten — ob ein
# fehlender Inhaltsschritt auf den Quellseiten steht, ist ungeprueft.
# Vom Maintainer am 2026-11-27 bestaetigt (inkl. akteure:).

leistung: fundsache
status: bestaetigt
gruppen:
  # --- Entsprechungen ---------------------------------------------------------
  - extraktion:
      1: "Gefundene Sache in Tram oder Bus dem Fahrpersonal geben oder bei ZVV-Contact bzw. VBZ-Beratungsstelle abgeben"
      2: "Gefundene Sache auf öffentlichem Grund bei einem Polizeiposten oder beim Fundbüro der Stadt Zürich abgeben"
      3: "Gefundene Sache per Post an das Fundbüro schicken, wenn persönliche Abgabe nicht möglich ist"
    hand:
      3: "Fundsache melden oder abgeben"
    notiz: "Abgabekanaele einzeln extrahiert (wie L2), Handdatei fasst sie zusammen"
  - extraktion:
      4: "Online eine Verlust-Anzeige für übrige Artikel machen"
    hand:
      6: "Verlust melden (Suchauftrag)"
    notiz: "Verlustmeldung; die Heuristik paarte faelschlich den Ausweis-Sonderfall (Ext 9)"
  - extraktion:
      7: "Verlierer:in benachrichtigen, wenn der Gegenstand gefunden wurde"
    hand:
      11: "Suchauftrag läuft (Benachrichtigung bei einem Fund)"
    notiz: "nur die Benachrichtigung (wie L2); die Heuristik paarte mit dem Endzustand Hand 10"
  - extraktion:
      8: "Fundgegenstand im Fundbüro abholen und Gebühr bezahlen"
    hand:
      9: "Gegen Ausweis abholen"
    notiz: "Abholung; die Heuristik paarte faelschlich mit dem Startknoten Hand 1"

  # --- Nur in der Extraktion --------------------------------------------------
  - extraktion:
      5: "Massenartikel direkt im Fundbüro suchen und abholen"
    hand: {}
    notiz: "Sonderfall Massenartikel (Selbstsuche statt Verlustmeldung); Handdatei modelliert ihn nicht"
  - extraktion:
      6: "Express-Suche für dringend benötigte Gegenstände aus VBZ- oder Forchbahn-Fahrzeugen beantragen"
    hand: {}
    notiz: "Zusatzleistung; Handdatei modelliert sie nicht"
  - extraktion:
      9: "Verlust eines Ausweises sofort der Polizei melden und Polizeibericht erhalten"
    hand: {}
    notiz: "Sonderfall Ausweis; Handdatei modelliert ihn nicht"
  - extraktion:
      10: "Verlorenen und damit ungültigen Ausweis einziehen"
    hand: {}
    notiz: "Sonderfall Ausweis (behoerdlicher Folgeschritt); Handdatei modelliert ihn nicht"
  - extraktion:
      11: "Nicht abgeholte Fundgegenstände aus dem öffentlichen Verkehr nach Ablauf der Aufbewahrungsfrist öffentlich verkaufen lassen"
    hand: {}
    notiz: "Folge nach Ablauf der Aufbewahrung; Handdatei modelliert sie nicht"
  - extraktion:
      12: "Nicht abgeholte Fundgegenstände vom öffentlichen Grund nach Ablauf der Aufbewahrungsfrist an öffentlicher Versteigerung verkaufen"
    hand: {}
    notiz: "Folge nach Ablauf der Aufbewahrung; Handdatei modelliert sie nicht"

  # --- Nur in der Handdatei ---------------------------------------------------
  - extraktion: {}
    hand:
      1: "Gegenstand gefunden oder verloren"
    nicht_belegbar: true
    notiz: "Startknoten"
  - extraktion: {}
    hand:
      2: "Gefunden oder verloren?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      4: "Fund erfassen und aufbewahren"
    notiz: "nicht extrahiert; laut L2-Pruefung (2026-10-14) teilweise echte Luecke"
  - extraktion: {}
    hand:
      5: "Fund gemeldet"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      7: "Mit Fundbestand abgleichen"
    nicht_belegbar: true
    notiz: "die Quelle nennt den Abgleich nicht ausdruecklich (geprueft 2026-10-14, L2)"
  - extraktion: {}
    hand:
      8: "Gegenstand vorhanden?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      10: "Gegenstand zurückerhalten"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      12: "Noch kein Treffer"
    nicht_belegbar: true
    notiz: "Endzustand"

akteure:
  "Finder:in": person
  "Verlierer:in": person
