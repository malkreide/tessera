# Schritt-Paarung fuer `tessera eval` (Extraktion <-> Handdatei).
#
# Jede Gruppe ordnet n Extraktionsschritte m Handschritten zu (1:1, n:1, 1:n).
# Eine Seite leer = Schritt bewusst ohne Entsprechung. `nicht_belegbar: true`
# (nur ohne Extraktionsschritte) markiert Handschritte, die die Quelle nicht
# woertlich nennt (Start-/Entscheidungs-/Endknoten); der Report zeigt dann
# zusaetzlich den Recall ohne sie. Jede Schritt-ID beider Dateien genau einmal;
# die Labels muessen den aktuellen Dateien entsprechen (sonst veraltet).
# Nach dem Pruefen `status: bestaetigt` setzen.
#
# Vorschlag von Claude fuer den Lauf vom 2026-10-13 (nach review_notes, PR #70),
# aus dem `--propose-pairs`-Entwurf korrigiert — out/fundsache.json und die
# Quellseiten wurden dabei nicht eingesehen. Gleiche Regeln wie beim Lauf vom
# 2026-10-12. Vom Maintainer gegen beide Dateien zu pruefen.

leistung: fundsache
status: vorschlag
gruppen:
  # --- Entsprechungen ---------------------------------------------------------
  - extraktion:
      9: "Gefundene Sachen aus Tram oder Bus dem Fahrpersonal geben"
      10: "Gefundene Sachen bei ZVV-Contact oder der VBZ-Beratungsstelle abgeben"
      11: "Gefundene Sachen auf öffentlichem Grund bei einem Polizeiposten abgeben"
      12: "Gefundene Sachen beim Fundbüro der Stadt Zürich abgeben"
      13: "Gefundene Sachen per Post an die angegebene Adresse schicken"
    hand:
      3: "Fundsache melden oder abgeben"
    notiz: "Extraktion fuehrt die Abgabekanaele einzeln, die Handdatei fasst sie zusammen"
  - extraktion:
      1: "Verlust online als Verlust-Anzeige melden"
      2: "Verlust beim Fundbüro, bei ZVV-Contact oder bei Mitarbeitenden vom Ereignismanagement und Fahrdienst melden"
    hand:
      6: "Verlust melden (Suchauftrag)"
    notiz: "Meldekanaele fuer den Verlust einzeln extrahiert"
  - extraktion:
      7: "Verlierer:in benachrichtigen, wenn der Gegenstand gefunden wurde"
    hand:
      11: "Suchauftrag läuft (Benachrichtigung bei einem Fund)"
    notiz: "nur die Benachrichtigung; den Abgleich (Hand 7) nennt dieser Lauf nicht"
  - extraktion:
      8: "Im Fundbüro nachfragen und Fundgegenstand abholen"
    hand:
      9: "Gegen Ausweis abholen"
    notiz: "Abholung im Fundbuero"

  # --- Nur in der Extraktion --------------------------------------------------
  - extraktion:
      3: "Verlust eines Ausweises sofort der Polizei melden"
    hand: {}
    notiz: "Sonderfall Ausweis; Handdatei modelliert ihn nicht"
  - extraktion:
      4: "Polizeibericht für die Beantragung eines neuen Ausweises verwenden"
    hand: {}
    notiz: "Sonderfall Ausweis; Handdatei modelliert ihn nicht"
  - extraktion:
      5: "Verlorenen Ausweis einziehen, da er ungültig ist"
    hand: {}
    notiz: "Sonderfall Ausweis (behoerdlicher Folgeschritt); Handdatei modelliert ihn nicht"
  - extraktion:
      6: "Express-Suche für dringend benötigte Gegenstände aus VBZ- oder Forchbahn-Fahrzeugen beantragen"
    hand: {}
    notiz: "Zusatzleistung; Handdatei modelliert sie nicht"
  - extraktion:
      14: "Von VBZ und Forchbahn gefundene Gegenstände nach Ablauf der Aufbewahrungsfrist öffentlich verkaufen"
    hand: {}
    notiz: "Folge nach Ablauf der Aufbewahrung; Handdatei modelliert sie nicht"
  - extraktion:
      15: "Nicht abgeholte Gegenstände vom öffentlichen Grund bei einer öffentlichen Versteigerung verkaufen"
    hand: {}
    notiz: "Folge nach Ablauf der Aufbewahrung; Handdatei modelliert sie nicht"

  # --- Nur in der Handdatei ---------------------------------------------------
  - extraktion: {}
    hand:
      1: "Gegenstand gefunden oder verloren"
    nicht_belegbar: true
    notiz: "Startknoten"
  - extraktion: {}
    hand:
      2: "Gefunden oder verloren?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      4: "Fund erfassen und aufbewahren"
    notiz: "fehlt in der Extraktion; pruefen, ob die Quelle Erfassung/Aufbewahrung nennt"
  - extraktion: {}
    hand:
      5: "Fund gemeldet (ggf. Finderlohn-Anspruch)"
    notiz: "Endzustand; der Finderlohn-Hinweis waere belegbar, falls die Quelle ihn nennt — darum nicht als unbelegbar markiert"
  - extraktion: {}
    hand:
      7: "Mit Fundbestand abgleichen"
    notiz: "fehlt in diesem Lauf (im Lauf vom 2026-10-12 in Ext 12 enthalten)"
  - extraktion: {}
    hand:
      8: "Gegenstand vorhanden?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      10: "Gegenstand zurückerhalten"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      12: "Noch kein Treffer"
    nicht_belegbar: true
    notiz: "Endzustand"
