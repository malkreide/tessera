# Schritt-Paarung fuer `tessera eval` (Extraktion <-> Handdatei).
#
# Jede Gruppe ordnet n Extraktionsschritte m Handschritten zu (1:1, n:1, 1:n).
# Eine Seite leer = Schritt bewusst ohne Entsprechung. `nicht_belegbar: true`
# (nur ohne Extraktionsschritte) markiert Handschritte, die die Quelle nicht
# woertlich nennt (Start-/Entscheidungs-/Endknoten); der Report zeigt dann
# zusaetzlich den Recall ohne sie. Jede Schritt-ID beider Dateien genau einmal;
# die Labels muessen den aktuellen Dateien entsprechen (sonst veraltet).
# Optional `akteure:` — extrahierte Rollennamen, die weder ID noch Label der
# Handdatei-actors[] treffen: `Name: id` (zuordnen), `Name: null` (bewusst ohne
# Entsprechung) oder `Name: ""` (noch offen).
# Nach dem Pruefen `status: bestaetigt` setzen.
#
# Lauf L4 vom 2026-10-14: vier Quellseiten, erstmals mit der Link-Korrektur in
# grounding.normalize (#89) — 14 Schritte, 0 Flags (kein Gate-Ausfall).
# Vorschlag von Claude aus dem `--propose-pairs`-Entwurf, korrigiert nach
# denselben Regeln wie die bestaetigte L3-Paarung (Git-Historie, d794f20);
# out/kita-platz.json wurde dabei nicht eingesehen, nur die Labels des Entwurfs.
# Vom Maintainer zu pruefen.

leistung: kita-platz
status: vorschlag
gruppen:
  # --- Entsprechungen ---------------------------------------------------------
  - extraktion:
      1: "Kita oder Tagesfamilie mit subventionierten Plätzen finden"
    hand:
      2: "Freien Kita-Platz suchen"
    notiz: "erstmals belegt — in L1–L3 fiel der Schritt durchs Gate (Link mit Klammern in der URL, #89); die Heuristik paarte faelschlich mit der Entscheidung Hand 3"
  - extraktion:
      2: "Beitragsfaktorbestätigung beim Schul- und Sportdepartement beantragen (online oder per Post)"
    hand:
      6: "Beitragsfaktorbestätigung beantragen"
  - extraktion:
      3: "Finanzielle Situation prüfen und Beitragsfaktor festlegen"
    hand:
      7: "Einkommen und Vermögen prüfen"
      9: "Beitragsfaktor nach Einkommen und Vermögen berechnen"
    notiz: "Pruefen und Festlegen in einem Schritt (wie L2/L3); die Heuristik paarte nur Hand 7"
  - extraktion:
      4: "Bestätigung des subventionsberechtigten Betreuungsumfangs (SBU) beim Sozialdepartement beantragen"
      5: "SBU-Antrag je nach Betreuungsgrund über «Mein Konto» oder über Fachstelle/Hotline stellen"
      6: "Bei sprachlicher oder sozialer Integration des Kindes an Sozialarbeiter:in oder Familienberatung wenden"
      7: "Bei gesundheitlichen Problemen an die Hotline wenden und Antragsformulare erhalten"
    hand:
      18: "SBU-Bestätigung beantragen (Betreuungsumfang)"
    notiz: "SBU-Antrag samt Antragswegen je Betreuungsgrund einzeln extrahiert (wie L2/L3); die Heuristik liess Ext 5–7 ungepaart"
  - extraktion:
      8: "SBU prüfen (Selbstdeklaration, Stichprobenkontrollen möglich)"
    hand:
      19: "Betreuungsumfang prüfen und SBU-Bestätigung ausstellen"
    notiz: "nur das Pruefen; das Ausstellen der Bestaetigung nennt der Schritt nicht"
  - extraktion:
      9: "Betreuungsvertrag mit der Kita abschliessen"
    hand:
      5: "Betreuungsvertrag mit der Kita abschliessen"
  - extraktion:
      10: "Beide Bestätigungen bei der Anmeldung bei der Kitaleitung abgeben"
    hand:
      17: "Bei der Anmeldung beide Bestätigungen der Kita abgeben"
  - extraktion:
      11: "Kind mit subventioniertem Platz dem Sozialdepartement melden (Finanzierungsantrag)"
    hand:
      20: "Kind über KiBEA beim Sozialdepartement melden (Finanzierungsantrag)"
  - extraktion:
      12: "Finanzierungsantrag bewilligen und Höhe des Elternbeitrags festlegen"
    hand:
      11: "Finanzierungsantrag bewilligen und Elternbeitrag festlegen"

  # --- Nur in der Extraktion --------------------------------------------------
  - extraktion:
      13: "Subventionierten Kostenanteil direkt an die Kita überweisen"
    hand: {}
    notiz: "Auszahlung an die Kita, wie L2/L3 ohne eigenen Handschritt (Hand 11 nennt sie nur in der Beschreibung); die Heuristik paarte faelschlich mit dem Endzustand Hand 12"
  - extraktion:
      14: "Reduzierten Elternbeitrag direkt an die Kita bezahlen"
    hand: {}
    notiz: "Zahlung der Eltern an die Kita; die Handdatei nennt sie nur in der Beschreibung von Hand 11"

  # --- Nur in der Handdatei ---------------------------------------------------
  - extraktion: {}
    hand:
      1: "Betreuungsbedarf für das Kind"
    nicht_belegbar: true
    notiz: "Startknoten"
  - extraktion: {}
    hand:
      3: "Subventionierter Platz frei?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      4: "Auf Warteliste bleiben"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt eine Warteliste (geprueft 2026-10-14); fuer-kitas/subventionen.html sagt nur: Kitas entscheiden selber ueber die Vergabe"
  - extraktion: {}
    hand:
      8: "Anspruch auf Subventionen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      10: "Beitragsfaktorbestätigung ausstellen (Verfügung)"
    notiz: "fehlt wie in L3 (in L2 Ext 4) — nicht extrahiert, nicht vom Gate verworfen"
  - extraktion: {}
    hand:
      12: "Subventionierter Kita-Platz"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      13: "Antrag ablehnen (mit Begründung)"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt eine Ablehnung des Antrags (geprueft 2026-10-14); die Handdatei hat fuer diesen Schritt weder Quelle noch Reference"
  - extraktion: {}
    hand:
      14: "Rechtsmittel ergreifen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      15: "Rechtsmittel gemäss Rechtsmittelbelehrung im Entscheid"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt Rechtsmittel (geprueft 2026-10-14); die Handdatei hat fuer diesen Schritt weder Quelle noch Reference"
  - extraktion: {}
    hand:
      16: "Antrag rechtskräftig abgelehnt"
    nicht_belegbar: true
    notiz: "Endzustand"

# Rollennamen der Extraktion, die weder ID noch Label der Handdatei-actors[]
# treffen (eltern, kita, schulamt, sozialdept, bezirksrat). Wie in L2/L3.
akteure:
  "Schul- und Sportdepartement": schulamt
  "Sozialdepartement": sozialdept
