# Schritt-Paarung fuer `tessera eval` (Extraktion <-> Handdatei).
#
# Jede Gruppe ordnet n Extraktionsschritte m Handschritten zu (1:1, n:1, 1:n).
# Eine Seite leer = Schritt bewusst ohne Entsprechung. `nicht_belegbar: true`
# (nur ohne Extraktionsschritte) markiert Handschritte, die die Quelle nicht
# woertlich nennt (Start-/Entscheidungs-/Endknoten); der Report zeigt dann
# zusaetzlich den Recall ohne sie. Jede Schritt-ID beider Dateien genau einmal;
# die Labels muessen den aktuellen Dateien entsprechen (sonst veraltet).
# Nach dem Pruefen `status: bestaetigt` setzen.
#
# Vorschlag von Claude fuer den Lauf vom 2026-10-13 (nach review_notes, PR #70),
# aus dem `--propose-pairs`-Entwurf korrigiert — out/kita-platz.json und die
# Quellseiten wurden dabei nicht eingesehen. Gleiche Regeln wie beim ersten
# Lauf. Vom Maintainer am 2026-10-14 bestaetigt (inkl. akteure:).

leistung: kita-platz
status: bestaetigt
gruppen:
  # --- Entsprechungen ---------------------------------------------------------
  - extraktion:
      2: "Beitragsfaktorbestätigung beim Schul- und Sportdepartement online oder per Post beantragen"
    hand:
      6: "Beitragsfaktorbestätigung beantragen"
  - extraktion:
      3: "Finanzielle Situation prüfen und Beitragsfaktor festlegen"
    hand:
      7: "Einkommen und Vermögen prüfen"
      9: "Beitragsfaktor nach Einkommen und Vermögen berechnen"
    notiz: "Pruefen und Festlegen in einem Schritt; die Heuristik paarte faelschlich mit Hand 11"
  - extraktion:
      4: "Beitragsfaktorbestätigung ausstellen"
    hand:
      10: "Beitragsfaktorbestätigung ausstellen (Verfügung)"
  - extraktion:
      5: "Bestätigung über den subventionsberechtigten Betreuungsumfang (SBU) beim Sozialdepartement beantragen"
      6: "Betreuungsgrund wählen (z.B. Erwerbstätigkeit, Aus-/Weiterbildung, Stellensuche, Freiwilligenarbeit)"
      7: "SBU-Gesuch online über «Mein Konto» stellen und Stellenprozente oder Stundenanzahl angeben"
      8: "Für SBU bei sprachlicher/sozialer Integration an Sozialarbeiter:in oder Familienberatung wenden"
      9: "Für SBU bei gesundheitlichen Problemen Antragsformulare über die Hotline anfordern"
    hand:
      18: "SBU-Bestätigung beantragen (Betreuungsumfang)"
    notiz: "SBU-Antrag samt Betreuungsgrund und Antragsweg je Grund einzeln extrahiert; die Handdatei fasst ihn zusammen"
  - extraktion:
      10: "Benötigten Betreuungsumfang prüfen und SBU ausstellen"
    hand:
      19: "Betreuungsumfang prüfen und SBU-Bestätigung ausstellen"
  - extraktion:
      13: "Subventionsunterlagen bei der Anmeldung in der Kita abgeben"
    hand:
      17: "Bei der Anmeldung beide Bestätigungen der Kita abgeben"
  - extraktion:
      12: "Betreuungsvertrag mit der Kita abschliessen"
    hand:
      5: "Betreuungsvertrag mit der Kita abschliessen"
    notiz: "Kante zu Hand 17 umgekehrt; die Quelle (nur faq.html) legt die Reihenfolge nicht fest, siehe pilot-2026-10.md"

  # --- Nur in der Extraktion --------------------------------------------------
  - extraktion:
      11: "Anträge vor dem Start in der Kita stellen"
    hand: {}
    notiz: "Zeitpunkt-Hinweis, kein eigener Schritt in der Handdatei"
  - extraktion:
      14: "Subventionen direkt an die Kita auszahlen, solange das Kind betreut wird"
    hand: {}
    notiz: "Auszahlung an die Kita; die Handdatei modelliert Finanzierungsantrag und Bewilligung (Hand 20, 11), nicht die Auszahlung — verwandt, nicht gleich (Heuristik paarte faelschlich mit Hand 1)"

  # --- Nur in der Handdatei ---------------------------------------------------
  - extraktion: {}
    hand:
      1: "Betreuungsbedarf für das Kind"
    nicht_belegbar: true
    notiz: "Startknoten"
  - extraktion: {}
    hand:
      2: "Freien Kita-Platz suchen"
    notiz: "entspricht wieder dem vom Grounding-Gate verworfenen Extraktionsschritt 1 (Belegstelle nicht woertlich)"
  - extraktion: {}
    hand:
      3: "Subventionierter Platz frei?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      4: "Auf Warteliste bleiben"
    notiz: "fehlt in der Extraktion; pruefen, ob die Quelle die Warteliste nennt"
  - extraktion: {}
    hand:
      8: "Anspruch auf Subventionen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      11: "Finanzierungsantrag bewilligen und Elternbeitrag festlegen"
    notiz: "fehlt in diesem Lauf (siehe Ext 14)"
  - extraktion: {}
    hand:
      12: "Subventionierter Kita-Platz"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      13: "Antrag ablehnen (mit Begründung)"
    notiz: "Ablehnungszweig fehlt in der Extraktion; pruefen, ob die Quelle ihn nennt"
  - extraktion: {}
    hand:
      14: "Rechtsmittel ergreifen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      15: "Rechtsmittel gemäss Rechtsmittelbelehrung im Entscheid"
    notiz: "Rechtsmittelzweig fehlt in der Extraktion; pruefen, ob die drei Quellseiten ihn nennen"
  - extraktion: {}
    hand:
      16: "Antrag rechtskräftig abgelehnt"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      20: "Kind über KiBEA beim Sozialdepartement melden (Finanzierungsantrag)"
    notiz: "fehlt in diesem Lauf (siehe Ext 14)"

# Rollennamen der Extraktion, die weder ID noch Label der Handdatei-actors[]
# treffen (eltern, kita, schulamt, sozialdept, bezirksrat). Vorschlag von
# Claude, aus den review_notes — Departement -> Kurz-ID der Handdatei pruefen.
akteure:
  "Schul- und Sportdepartement": schulamt
  "Sozialdepartement": sozialdept
  "Stadt Zürich": null  # zu unspezifisch fuer eine Zuordnung
