# Schritt-Paarung fuer `tessera eval` (Extraktion <-> Handdatei).
#
# Jede Gruppe ordnet n Extraktionsschritte m Handschritten zu (1:1, n:1, 1:n).
# Eine Seite leer = Schritt bewusst ohne Entsprechung. `nicht_belegbar: true`
# (nur ohne Extraktionsschritte) markiert Handschritte, die die Quelle nicht
# woertlich nennt (Start-/Entscheidungs-/Endknoten); der Report zeigt dann
# zusaetzlich den Recall ohne sie. Jede Schritt-ID beider Dateien genau einmal;
# die Labels muessen den aktuellen Dateien entsprechen (sonst veraltet).
# Optional `akteure:` — extrahierte Rollennamen, die weder ID noch Label der
# Handdatei-actors[] treffen: `Name: id` (zuordnen), `Name: null` (bewusst ohne
# Entsprechung) oder `Name: ""` (noch offen).
# Nach dem Pruefen `status: bestaetigt` setzen.
#
# Vorschlag von Claude fuer den Lauf L5 vom 2026-11-27, aus dem
# `--propose-pairs`-Entwurf korrigiert. Extraktions-Labels aus der
# Konsolenausgabe des Laufs uebernommen, Hand-Labels aus maschinerie-zuerich
# main; out/*.json und die Quellseiten wurden dabei NICHT eingesehen.
# `nicht_belegbar` nur fuer Start-, Entscheidungs- und Endknoten — ob ein
# fehlender Inhaltsschritt auf den Quellseiten steht, ist ungeprueft.
# Vom Maintainer am 2026-11-27 bestaetigt (inkl. akteure:).

leistung: kita-platz
status: bestaetigt
gruppen:
  # --- Entsprechungen ---------------------------------------------------------
  - extraktion:
      1: "Kita oder Tagesfamilie mit subventionierten Plätzen finden"
    hand:
      2: "Freien Kita-Platz suchen"
    notiz: "Platzsuche; die Heuristik paarte faelschlich mit der Entscheidung Hand 3"
  - extraktion:
      3: "Beitragsfaktorbestätigung beim Schul- und Sportdepartement beantragen"
    hand:
      6: "Beitragsfaktorbestätigung beantragen"
  - extraktion:
      4: "Finanzielle Situation prüfen und Beitragsfaktor festlegen"
    hand:
      7: "Einkommen und Vermögen prüfen"
      9: "Beitragsfaktor nach Einkommen und Vermögen berechnen"
    notiz: "Pruefen und Festlegen in einem Schritt (wie L2–L4); die Heuristik paarte nur Hand 7"
  - extraktion:
      5: "Bestätigung des subventionsberechtigten Betreuungsumfangs (SBU) beantragen"
      6: "SBU-Antrag online über «Mein Konto» stellen (bei Erwerbstätigkeit, Freiwilligenarbeit, Aus-/Weiterbildung, Stellensuche)"
      7: "SBU bei sprachlicher/sozialer Integration über Sozialarbeiter:in oder Familienberatung beantragen"
      8: "SBU bei gesundheitlichen Gründen über die Hotline beantragen"
    hand:
      18: "SBU-Bestätigung beantragen (Betreuungsumfang)"
    notiz: "SBU-Antrag samt Antragswegen je Betreuungsgrund einzeln extrahiert (wie L2–L4)"
  - extraktion:
      9: "SBU ausstellen (Prüfung der benötigten Betreuungstage)"
    hand:
      19: "Betreuungsumfang prüfen und SBU-Bestätigung ausstellen"
    notiz: "Pruefen und Ausstellen in einem Schritt; die Heuristik liess ihn ungepaart"
  - extraktion:
      10: "Betreuungsvertrag mit der Kita abschliessen"
    hand:
      5: "Betreuungsvertrag mit der Kita abschliessen"
  - extraktion:
      11: "Beide Bestätigungen bei der Kitaleitung bei der Anmeldung abgeben"
    hand:
      17: "Bei der Anmeldung beide Bestätigungen der Kita abgeben"
  - extraktion:
      12: "Kind über die Plattform KiBEA mittels Finanzierungsantrag dem Sozialdepartement melden"
    hand:
      20: "Kind über KiBEA beim Sozialdepartement melden (Finanzierungsantrag)"
  - extraktion:
      13: "Finanzierungsantrag bewilligen und Höhe des Elternbeitrags festlegen"
    hand:
      11: "Finanzierungsantrag bewilligen und Elternbeitrag festlegen"

  # --- Nur in der Extraktion --------------------------------------------------
  - extraktion:
      2: "Finanziellen Anspruch mit dem Online-Beitragsrechner prüfen"
    hand: {}
    notiz: "Vorabklaerung per Beitragsrechner; Handdatei modelliert sie nicht"
  - extraktion:
      14: "Reduzierten Elternbeitrag direkt an die Kita bezahlen"
    hand: {}
    notiz: "Zahlung der Eltern an die Kita; die Handdatei nennt sie nur in der Beschreibung von Hand 11 (wie L4)"
  - extraktion:
      15: "Subventionierten Kostenanteil der Kita überweisen"
    hand: {}
    notiz: "Auszahlung an die Kita, ohne eigenen Handschritt (wie L4); die Heuristik paarte faelschlich mit dem Endzustand Hand 12"

  # --- Nur in der Handdatei ---------------------------------------------------
  - extraktion: {}
    hand:
      1: "Betreuungsbedarf für das Kind"
    nicht_belegbar: true
    notiz: "Startknoten"
  - extraktion: {}
    hand:
      3: "Subventionierter Platz frei?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      4: "Auf Warteliste bleiben"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt eine Warteliste (geprueft 2026-10-14)"
  - extraktion: {}
    hand:
      8: "Anspruch auf Subventionen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      10: "Beitragsfaktorbestätigung ausstellen (Verfügung)"
    notiz: "nicht extrahiert (wie L3/L4), nicht vom Gate verworfen"
  - extraktion: {}
    hand:
      12: "Subventionierter Kita-Platz"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      13: "Antrag ablehnen (mit Begründung)"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt eine Ablehnung des Antrags (geprueft 2026-10-14)"
  - extraktion: {}
    hand:
      14: "Rechtsmittel ergreifen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      15: "Einsprache beim Schulamt (gemäss Rechtsmittelbelehrung)"
    nicht_belegbar: true
    notiz: "nur im PDF Muster-Beitragsfaktorbestaetigung belegt; tessera v1 liest keine PDFs"
  - extraktion: {}
    hand:
      16: "Antrag rechtskräftig abgelehnt"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      21: "Einsprache beim Sozialdepartement gegen den festgelegten Betreuungsumfang"
    nicht_belegbar: true
    notiz: "nur im PDF Merkblatt SBU, Abschnitt 4.3 belegt; tessera v1 liest keine PDFs"

akteure:
  "Schul- und Sportdepartement": schulamt
  "Sozialdepartement": sozialdept
