# Schritt-Paarung fuer `tessera eval` (Extraktion <-> Handdatei).
#
# Jede Gruppe ordnet n Extraktionsschritte m Handschritten zu (1:1, n:1, 1:n).
# Eine Seite leer = Schritt bewusst ohne Entsprechung. `nicht_belegbar: true`
# (nur ohne Extraktionsschritte) markiert Handschritte, die die Quelle nicht
# woertlich nennt (Start-/Entscheidungs-/Endknoten); der Report zeigt dann
# zusaetzlich den Recall ohne sie. Jede Schritt-ID beider Dateien genau einmal;
# die Labels muessen den aktuellen Dateien entsprechen (sonst veraltet).
# Optional `akteure:` — extrahierte Rollennamen, die weder ID noch Label der
# Handdatei-actors[] treffen: `Name: id` (zuordnen), `Name: null` (bewusst ohne
# Entsprechung) oder `Name: ""` (noch offen).
# Nach dem Pruefen `status: bestaetigt` setzen.
#
# Lauf L3 vom 2026-10-14 (vier Quellseiten, neu fuer-kitas/subventionen.html,
# #83). Vorschlag von Claude aus dem `--propose-pairs`-Entwurf, korrigiert nach
# denselben Regeln wie die bestaetigte L2-Paarung (Git-Historie, fa4e0f5);
# out/kita-platz.json wurde dabei nicht eingesehen, nur die Labels des Entwurfs.
# Das Gate verwarf 2 Schritte (laut out/kita-platz.flags.json): Ext 1 «Kita
# oder Tagesfamilie mit subventionierten Plätzen suchen» (= Hand 2) und Ext 4
# «SBU online über «Mein Konto» beantragen …» (gehoerte zu Hand 18).
# Vom Maintainer zu pruefen.

leistung: kita-platz
status: vorschlag
gruppen:
  # --- Entsprechungen ---------------------------------------------------------
  - extraktion:
      2: "Beitragsfaktorbestätigung beim Schul- und Sportdepartement online oder per Post beantragen"
    hand:
      6: "Beitragsfaktorbestätigung beantragen"
  - extraktion:
      3: "Finanzielle Situation prüfen und Beitragsfaktor festlegen"
    hand:
      7: "Einkommen und Vermögen prüfen"
      9: "Beitragsfaktor nach Einkommen und Vermögen berechnen"
    notiz: "Pruefen und Festlegen in einem Schritt (wie L2); die Heuristik paarte nur Hand 7"
  - extraktion:
      5: "SBU über Sozialarbeiter:in oder Familienberatung beantragen (bei sprachlicher oder sozialer Integration des Kindes)"
      6: "SBU-Antragsformulare über die Hotline anfordern (bei gesundheitlichen Gründen)"
    hand:
      18: "SBU-Bestätigung beantragen (Betreuungsumfang)"
    notiz: "SBU-Antrag je Antragsweg einzeln extrahiert (wie L2); die Heuristik liess Ext 6 ungepaart. Der Hauptweg ueber «Mein Konto» (Ext 4) fiel durchs Gate"
  - extraktion:
      7: "Subventionsberechtigten Betreuungsumfang prüfen und Bestätigung ausstellen"
    hand:
      19: "Betreuungsumfang prüfen und SBU-Bestätigung ausstellen"
  - extraktion:
      8: "Kind in der Kita anmelden und Betreuungsvertrag abschliessen"
    hand:
      5: "Betreuungsvertrag mit der Kita abschliessen"
    notiz: "Anmeldung und Vertrag in einem Schritt; Kante zu Hand 17 wieder umgekehrt — die Quelle legt die Reihenfolge nicht fest (pilot-2026-10.md)"
  - extraktion:
      9: "Beide Bestätigungen vor Start bei der Kitaleitung abgeben"
    hand:
      17: "Bei der Anmeldung beide Bestätigungen der Kita abgeben"
  - extraktion:
      10: "Kind für subventionierten Platz dem Sozialdepartement melden (Finanzierungsantrag)"
    hand:
      20: "Kind über KiBEA beim Sozialdepartement melden (Finanzierungsantrag)"
    notiz: "neu in L3 — Quelle fuer-kitas/subventionen.html (#83)"
  - extraktion:
      11: "Finanzierungsantrag bewilligen und Höhe des Elternbeitrags festlegen"
    hand:
      11: "Finanzierungsantrag bewilligen und Elternbeitrag festlegen"
    notiz: "neu in L3 — Quelle fuer-kitas/subventionen.html (#83)"

  # --- Nur in der Extraktion --------------------------------------------------
  - extraktion:
      12: "Reduzierten Elternbeitrag direkt an die Kita bezahlen"
    hand: {}
    notiz: "Zahlung der Eltern an die Kita; die Handdatei nennt sie nur in der Beschreibung von Hand 11"
  - extraktion:
      13: "Subventionierten Kostenanteil der Kita überweisen"
    hand: {}
    notiz: "Auszahlung an die Kita, wie L2 ohne eigenen Handschritt (Hand 11 nennt sie nur in der Beschreibung); die Heuristik paarte faelschlich mit dem Endzustand Hand 12"

  # --- Nur in der Handdatei ---------------------------------------------------
  - extraktion: {}
    hand:
      1: "Betreuungsbedarf für das Kind"
    nicht_belegbar: true
    notiz: "Startknoten"
  - extraktion: {}
    hand:
      2: "Freien Kita-Platz suchen"
    notiz: "fehlt; zum dritten Mal vom Grounding-Gate verworfen (L3: Ext 1 «Kita oder Tagesfamilie mit subventionierten Plätzen suchen»)"
  - extraktion: {}
    hand:
      3: "Subventionierter Platz frei?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      4: "Auf Warteliste bleiben"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt eine Warteliste (geprueft 2026-10-14); fuer-kitas/subventionen.html sagt nur: Kitas entscheiden selber ueber die Vergabe"
  - extraktion: {}
    hand:
      8: "Anspruch auf Subventionen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      10: "Beitragsfaktorbestätigung ausstellen (Verfügung)"
    notiz: "fehlt in diesem Lauf (in L2 Ext 4) — nicht extrahiert, nicht vom Gate verworfen (Laufvarianz)"
  - extraktion: {}
    hand:
      12: "Subventionierter Kita-Platz"
    nicht_belegbar: true
    notiz: "Endzustand"
  - extraktion: {}
    hand:
      13: "Antrag ablehnen (mit Begründung)"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt eine Ablehnung des Antrags (geprueft 2026-10-14); die Handdatei hat fuer diesen Schritt weder Quelle noch Reference"
  - extraktion: {}
    hand:
      14: "Rechtsmittel ergreifen?"
    nicht_belegbar: true
    notiz: "Entscheidung"
  - extraktion: {}
    hand:
      15: "Rechtsmittel gemäss Rechtsmittelbelehrung im Entscheid"
    nicht_belegbar: true
    notiz: "keine Quellseite nennt Rechtsmittel (geprueft 2026-10-14); die Handdatei hat fuer diesen Schritt weder Quelle noch Reference"
  - extraktion: {}
    hand:
      16: "Antrag rechtskräftig abgelehnt"
    nicht_belegbar: true
    notiz: "Endzustand"

# Rollennamen der Extraktion, die weder ID noch Label der Handdatei-actors[]
# treffen (eltern, kita, schulamt, sozialdept, bezirksrat). Wie in L2.
akteure:
  "Schul- und Sportdepartement": schulamt
  "Sozialdepartement": sozialdept
