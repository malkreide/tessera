    # Freischaltung dieses Hochrisiko-Falls entscheiden. Pilot seit 2026-10-09:
    # fundsache (nur stadt-zuerich.ch; hund-anmelden braucht auch zh.ch).
    # Erster Lauf 2026-10-12 gemessen (reports/eval/fundsache.pairs.yaml); auf
    # Maintainer-Entscheid vom 2026-10-13 folgt kita-platz als zweiter Lauf, bevor
    # ueber die Freischaltung entschieden wird.
    # Lokaler Testlauf 2026-10-14 (ohne pr): 3/3 bindende References verifiziert
    # (u.a. Vorlauffrist), aber nur 5 Schritte — Bewilligung, Gebuehr, Ablehnung
