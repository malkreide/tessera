    # der Amtlichen Sammlung (551.210/214/280). Maintainer-Entscheid 2026-10-14:
    # weiter gesperrt (reports/pilot-2026-10.md, Nachtrag).
    paused: "Quellen fuer Bewilligung, Gebuehr und Rekurs nur als PDF-Erlasse — v1 ohne PDF-Parsing (siehe reports/pilot-2026-10.md)"
    notes: >-
      HOCHRISIKO — als einzige Ausnahme vorgesehen (Draft-PR, Merge nur durch
      Menschen), derzeit gesperrt (`paused`). Erhoehter Gate greift automatisch (risk.py): JEDE
      bindende Reference (Vorlauffrist, Gebuehr, Auflagen, Rekursfrist) muss
      `verifiziert` UND woertlich belegt sein — eine ungrounded bindende
      Reference ist hier ein Validator-FEHLER, kein Hinweis. Fristen NUR als
      Reference (Label ohne Zahl + Deep-Link + Zitat), nie als Wert im
      Schritt-Label.
    review_notes: >-
      Die Vorlauffrist «spaetestens vier Wochen vor dem Veranstaltungsbeginn»
      ist auf der fest-sportveranstaltung-quartierfest-Seite belegbar.
      Bestehende handmodellierte Zieldatei traegt actors[] (veranstalter,
      stapo-bew, fachstellen, statthalter) und `disclaimer_key:
      Prozesse.disclaimerHochrisiko` -> Actor-Abgleich greift, der
      Hochrisiko-Disclaimer wird erwartet. Unbekannte Rollen werden im PR
      geflaggt, nicht geraten. ACHTUNG fuer `tessera eval`: der spezialisierte
      Extraktor (VERANSTALTUNG_HINT) nennt diese Akteure und die typische
      Struktur bewusst im Prompt — Akteurs- und Strukturwerte sind hier nicht
      unabhaengig vom Massstab.

  # --- Phase C (2026-11-26, Maintainer-Entscheid) ------------------------------
